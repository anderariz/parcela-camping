<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#173f2a"><link rel="manifest" href="manifest.webmanifest"><title>Parcela Camping V12.2</title>
<style>
:root{--bg:#e9eee9;--panel:#fff;--line:#d7ded7;--text:#1e2822;--muted:#6f786f;--green:#174d31;--blue:#2f76e7;--shadow:0 14px 38px rgba(20,35,25,.16)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}button,input,select{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}.top{position:fixed;left:0;right:0;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px}.brand{font-weight:850;font-size:18px;margin-right:auto}.workspace{position:absolute;left:0;right:0;top:66px;bottom:68px;background:#dfe5df}#stage{width:100%;height:100%;display:block;touch-action:none}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:7px 8px max(7px,env(safe-area-inset-bottom));display:flex;justify-content:space-around}.bottom button{border:0;background:transparent;padding:5px 7px;font-size:12px}.bi{display:block;font-size:20px}.fab{position:fixed;right:18px;bottom:88px;width:58px;height:58px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:30px;z-index:55;box-shadow:var(--shadow)}.context{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:56;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:5px;display:none;gap:3px}.context.show{display:flex}.context button{border:0;font-size:12px}.back{position:fixed;inset:0;z-index:80;background:rgba(17,27,20,.24);opacity:0;pointer-events:none}.back.open{opacity:1;pointer-events:auto}.panel{position:fixed;z-index:90;background:#fff;box-shadow:var(--shadow);overflow:auto;transition:.22s;padding:12px 14px calc(16px + env(safe-area-inset-bottom));left:8px;right:8px;bottom:8px;max-height:72vh;border-radius:20px;transform:translateY(calc(100% + 30px))}.panel.open{transform:translateY(0)}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-12px;background:#fff;padding:4px 0 8px;z-index:2}.head h2{margin:0;font-size:19px}.close{width:42px;height:42px;padding:0;font-size:20px}label{display:grid;gap:5px;font-size:12px;color:var(--muted);margin-bottom:8px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lib{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lib button{text-align:left;min-height:52px}.primary{background:var(--green);color:#fff;border-color:var(--green)}.note{font-size:11px;color:var(--muted);padding:8px 10px;background:#f4f6f4;border-radius:10px}
@media(orientation:landscape) and (max-height:650px){.panel{top:8px;bottom:8px;left:auto;right:8px;width:min(390px,42vw);max-height:none;transform:translateX(calc(100% + 30px))}.panel.open{transform:translateX(0)}}
</style></head><body>
<div class="top"><div class="brand">⛺ Parcela Camping · V12.2</div><button id="fitTop">⌗</button><button id="menuBtn">☰</button></div>
<div class="workspace"><svg id="stage" viewBox="0 0 1200 900"></svg></div>
<div class="navpad" aria-label="Navegación">
  <span></span><button id="panUp" aria-label="Arriba">▲</button><span></span>
  <button id="panLeft" aria-label="Izquierda">◀</button><button id="fitMini" aria-label="Ajustar">⌗</button><button id="panRight" aria-label="Derecha">▶</button>
  <button id="zoomOut" aria-label="Alejar">−</button><button id="panDown" aria-label="Abajo">▼</button><button id="zoomIn" aria-label="Acercar">+</button>
</div>
<div id="ctx" class="context"><button id="rot">↻ Girar</button><button id="dup">⧉ Duplicar</button><button id="lock">🔒</button><button id="del">🗑</button><button id="measure">📐</button></div>
<button id="fab" class="fab">+</button>
<div class="bottom"><button id="parcelBtn"><span class="bi">🏕️</span>Parcela</button><button><span class="bi">✥</span>Diseño</button><button id="fitBtn"><span class="bi">⌗</span>Ajustar</button><button id="gridBtn"><span class="bi">▦</span>Rejilla</button><button id="clearBtn"><span class="bi">⌫</span>Limpiar</button></div>
<div id="back" class="back"></div>

<div id="settings" class="panel"><div class="head"><h2>Parcela y diseño</h2><button class="close" data-close>✕</button></div>
<div class="row"><label>Ancho<input id="pw" type="number" value="9" step=".5"></label><label>Largo<input id="ph" type="number" value="10" step=".5"></label></div>
<label>Suelo<select id="ground"><option value="grass">Hierba</option><option value="gravel">Grava</option></select></label>
<label>Calle<select id="road"><option value="top">Arriba</option><option value="right">Derecha</option><option value="bottom">Abajo</option><option value="left">Izquierda</option></select></label>
<button id="applyPlot" class="primary" style="width:100%">Aplicar cambios</button>
<div class="row" style="margin-top:10px"><button id="save">Guardar</button><button id="load">Cargar</button></div></div>

<div id="parcels" class="panel"><div class="head"><h2>🏕️ Elegir parcela</h2><button class="close" data-close>✕</button></div><label>Parcela<select id="plotSel"></select></label><div id="summary" class="note"></div>
<div style="margin:10px 0 2px">
  <label style="display:flex;grid-template-columns:auto 1fr;align-items:center;gap:8px;color:var(--text);font-size:13px">
    <input id="keepGear" type="checkbox" checked style="width:auto">
    Mantener mis elementos al cambiar de parcela
  </label>
</div>
<button id="loadPlot" class="primary" style="width:100%;margin-top:10px">Cargar parcela</button></div>

<div id="add" class="panel"><div class="head"><h2>Añadir elemento</h2><button class="close" data-close>✕</button></div>
<div class="lib"><button data-add="car">🚗 Coche</button><button data-add="van">🚐 VW T4</button><button data-add="bigvan">🚐 Furgoneta</button><button data-add="caravan">🏕️ Caravana</button><button data-add="motorhome">🚌 Autocaravana</button><button data-add="floor">▦ Tela suelo</button><button data-add="table">🪵 Mesa</button><button data-add="chair">🪑 Silla</button><button data-add="bike">🚲 Bici</button></div></div>

<div id="props" class="panel"><div class="head"><h2>📐 Medidas</h2><button class="close" data-close>✕</button></div><div class="row"><label>Ancho<input id="ow" type="number" step=".05"></label><label>Largo<input id="oh" type="number" step=".05"></label></div><button id="applyObj" class="primary" style="width:100%">Aplicar medidas</button></div>
