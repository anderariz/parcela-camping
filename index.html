function drawGround(g){
  let{vbW,vbH,s,ox,oy,road}=g;
  svg.appendChild(E('rect',{x:0,y:0,width:vbW,height:vbH,fill:'#d9dfd8'}));

  // Textura fotográfica embebida: no requiere archivos adicionales.
  let defs=E('defs');
  let pat=E('pattern',{id:'groundTexture',patternUnits:'userSpaceOnUse',width:260,height:260});
  let img=E('image',{x:0,y:0,width:260,height:260,preserveAspectRatio:'xMidYMid slice'});
  img.setAttribute('href',ground==='grass'?GRASS_TEXTURE:GRAVEL_TEXTURE);
  pat.appendChild(img);defs.appendChild(pat);

  let grad=E('linearGradient',{id:'groundLight',x1:'0%',y1:'0%',x2:'100%',y2:'100%'});
  grad.appendChild(E('stop',{offset:'0%','stop-color':'#ffffff','stop-opacity':'.05'}));
  grad.appendChild(E('stop',{offset:'55%','stop-color':'#ffffff','stop-opacity':'0'}));
  grad.appendChild(E('stop',{offset:'100%','stop-color':'#000000','stop-opacity':'.07'}));
  defs.appendChild(grad);
  svg.appendChild(defs);

  svg.appendChild(E('rect',{x:ox,y:oy,width:plotW*s,height:plotH*s,rx:8,fill:'url(#groundTexture)',stroke:'#5f685f','stroke-width':2}));
  svg.appendChild(E('rect',{x:ox,y:oy,width:plotW*s,height:plotH*s,rx:8,fill:'url(#groundLight)',opacity:.65}));

  let r,tx,ty,tr=0;
  if(roadSide==='top'){r={x:ox,y:oy-road,width:plotW*s,height:road};tx=ox+plotW*s/2;ty=oy-road/2+5}
  if(roadSide==='bottom'){r={x:ox,y:oy+plotH*s,width:plotW*s,height:road};tx=ox+plotW*s/2;ty=oy+plotH*s+road/2+5}
  if(roadSide==='left'){r={x:ox-road,y:oy,width:road,height:plotH*s};tx=ox-road/2;ty=oy+plotH*s/2;tr=-90}
  if(roadSide==='right'){r={x:ox+plotW*s,y:oy,width:road,height:plotH*s};tx=ox+plotW*s+road/2;ty=oy+plotH*s/2;tr=90}
  svg.appendChild(E('rect',{...r,fill:'#c6b18a'}));
  for(let i=0;i<90;i++){
    let rx=r.x+((i*67)%Math.max(1,r.width)),ry=r.y+((i*41)%Math.max(1,r.height));
    svg.appendChild(E('circle',{cx:rx,cy:ry,r:1+(i%3),fill:i%2?'#9f8d71':'#ded0b0',opacity:.42}))
  }

  if(gridVisible){

    for(let y=0;y<=plotH+.001;y+=gridStep)svg.appendChild(E('line',{x1:ox,y1:oy+y*s,x2:ox+plotW*s,y2:oy+y*s,stroke:'#fff','stroke-width':y%1===0?1.05:.55,opacity:.24}))
  }
